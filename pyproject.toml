[project]
name = "3dprintbuddy"
version = "0.1.0"
description = "Self-hosted, plugin-based 3D printer management platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

# Bundled adapters register themselves here so core discovers them at startup.
# Third-party adapters add their own entry point in their own pyproject.toml.
[project.entry-points."threedprintbuddy.adapters"]
bambu        = "backend.adapters.bambu:BambuAdapter"
snapmaker_u1 = "backend.adapters.snapmaker_u1:SnapmakerU1Adapter"
klipper      = "backend.adapters.klipper:KlipperAdapter"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__", "static", "frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ARG001", "ARG002", "SIM108", "SIM102", "SIM105"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
